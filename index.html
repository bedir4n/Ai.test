<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masa Başı Denetçi</title>
<style>
  :root {
    --ink: #d8cfb8;
    --dim: #8a806a;
    --red: #b3372c;
    --bg: #0b0b0a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: "Courier New", monospace; color: var(--ink); }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; background: rgba(10,9,7,.78); border: 1px solid #3a342a; padding: 10px 14px; font-size: 13px; line-height: 1.5; }
  #top-left { top: 12px; left: 12px; }
  #top-right { top: 12px; right: 12px; text-align: right; }
  #rule { color: var(--red); font-weight: bold; }
  .label { color: var(--dim); }
  #light-bar { width: 160px; height: 6px; background: #1c1a15; margin-top: 4px; }
  #light-fill { height: 100%; width: 100%; background: #d9b35a; transition: width .2s linear; }
  #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--dim); text-align: center; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }
</style>
</head>
<body>
<div id="hud">
  <div id="vignette"></div>
  <div class="panel" id="top-left">
    <div><span class="label">GÜN</span> <b id="day">1</b></div>
    <div><span class="label">GÜNÜN KURALI:</span> <span id="rule">İsyan riski — METAL YASAK</span></div>
  </div>
  <div class="panel" id="top-right">
    <div><span class="label">İŞLENEN</span> <b id="quota">0 / 5</b></div>
    <div><span class="label">RÖNTGEN</span> <b id="xray">3</b></div>
    <div><span class="label">JENERATÖR</span></div>
    <div id="light-bar"><div id="light-fill"></div></div>
  </div>
  <div id="hint"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- Renderer / Sahne ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0a);
scene.fog = new THREE.Fog(0x0b0b0a, 5, 14);

// Oyuncu masada oturuyor, bandı ve masayı yukarıdan görüyor
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 50);
const CAM_BASE = new THREE.Vector3(0, 1.8, 1.25);
camera.position.copy(CAM_BASE);
const lookTarget = new THREE.Vector3(0, 0.78, -0.45);

// ---------- Işıklar ----------
const ambient = new THREE.HemisphereLight(0xb8c2c8, 0x3a3226, 0.9);
scene.add(ambient);

// Tavandaki floresan (soğuk genel ışık)
const ceiling = new THREE.PointLight(0xdfe8e4, 14, 8, 1.4);
ceiling.position.set(0, 2.6, -0.4);
ceiling.castShadow = true;
ceiling.shadow.mapSize.set(1024, 1024);
ceiling.shadow.bias = -0.001;
scene.add(ceiling);
const tube = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.04, 0.08), new THREE.MeshBasicMaterial({ color: 0xe8f2ee }));
tube.position.set(0, 2.7, -0.4);
scene.add(tube);

// Masa lambası (sıcak odak ışığı)
const lamp = new THREE.SpotLight(0xffd79a, 6, 5, Math.PI / 3.6, 0.6, 1.6);
lamp.position.set(-0.85, 1.25, -0.28);
lamp.target.position.set(-0.1, 0.8, -0.2);
lamp.castShadow = true;
lamp.shadow.mapSize.set(1024, 1024);
lamp.shadow.bias = -0.0005;
scene.add(lamp, lamp.target);

// ---------- Oda ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: 0x4a4944, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x4d5448, roughness: 1 });
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
backWall.position.set(0, 2.5, -1.4);
backWall.receiveShadow = true;
scene.add(backWall);
// Duvarın alt yarısı koyu boyalı (kurum duvarı)
const wainscot = new THREE.Mesh(new THREE.PlaneGeometry(12, 1.2), new THREE.MeshStandardMaterial({ color: 0x2f3a33, roughness: 0.9 }));
wainscot.position.set(0, 0.6, -1.39);
scene.add(wainscot);

// ---------- Konveyör bant ----------
const BELT_Z = -0.62;
const BELT_Y = 0.9;           // bant üst yüzeyi
const BELT_LEN = 5.2;
const BELT_W = 0.55;
const BELT_SPEED = 0.55;      // m/sn
const SPAWN_X = 2.4;          // sağdaki açıklıktan girer
const EXIT_X = -2.4;          // soldaki açıklıktan çıkar
const INSPECT_X = 0;          // tam önümüzde durur

const frameMat = new THREE.MeshStandardMaterial({ color: 0x3b4238, metalness: 0.6, roughness: 0.5 });
const frameL = new THREE.Mesh(new THREE.BoxGeometry(BELT_LEN, 0.08, 0.04), frameMat);
frameL.position.set(0, BELT_Y - 0.02, BELT_Z + BELT_W / 2 + 0.02);
const frameR = frameL.clone();
frameR.position.z = BELT_Z - BELT_W / 2 - 0.02;
const beltBody = new THREE.Mesh(new THREE.BoxGeometry(BELT_LEN, 0.1, BELT_W), frameMat);
beltBody.position.set(0, BELT_Y - 0.06, BELT_Z);
beltBody.receiveShadow = true;
scene.add(frameL, frameR, beltBody);
for (let x = -2.2; x <= 2.2; x += 1.1) {
  for (const dz of [BELT_W / 2 - 0.03, -BELT_W / 2 + 0.03]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05, BELT_Y - 0.1, 0.05), frameMat);
    leg.position.set(x, (BELT_Y - 0.1) / 2, BELT_Z + dz);
    scene.add(leg);
  }
}

// Kayan lastik yüzey (dokusu kaydırılarak hareket hissi verilir)
function makeBeltTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#1d1d1b'; x.fillRect(0, 0, 256, 64);
  x.fillStyle = '#2c2c29';
  for (let i = 0; i < 256; i += 32) x.fillRect(i, 0, 6, 64);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(BELT_LEN / 0.4, 1);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const beltTex = makeBeltTexture();
const beltTop = new THREE.Mesh(new THREE.PlaneGeometry(BELT_LEN, BELT_W - 0.02), new THREE.MeshStandardMaterial({ map: beltTex, roughness: 0.85 }));
beltTop.rotation.x = -Math.PI / 2;
beltTop.position.set(0, BELT_Y - 0.009, BELT_Z);
beltTop.receiveShadow = true;
scene.add(beltTop);

// Bandın iki ucundaki duvar açıklıkları (lastik perdeli)
function makeOpening(x) {
  const g = new THREE.Group();
  const w = 0.75, h = 0.6;
  const dark = new THREE.Mesh(new THREE.BoxGeometry(0.3, h, w), new THREE.MeshBasicMaterial({ color: 0x050505 }));
  dark.position.y = BELT_Y + h / 2 - 0.05;
  const topBar = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.08, w + 0.1), frameMat);
  topBar.position.y = BELT_Y + h;
  g.add(dark, topBar);
  const flapMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.6, transparent: true, opacity: 0.85 });
  for (let i = 0; i < 6; i++) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.01, h - 0.12, w / 6 - 0.01), flapMat);
    f.position.set(x > 0 ? -0.16 : 0.16, BELT_Y + h / 2, -w / 2 + w / 12 + i * w / 6);
    g.add(f);
  }
  // Açıklığın etrafındaki duvar parçası
  const wall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.6, 2.4), wallMat);
  wall.position.set(0, 1.3 + (BELT_Y + h) / 2 + 0.05, 0);
  wall.scale.y = (2.6 - (BELT_Y + h)) / 2.6;
  wall.position.y = BELT_Y + h + (2.6 - (BELT_Y + h)) / 2 + 0.04;
  const wallLow = new THREE.Mesh(new THREE.BoxGeometry(0.2, BELT_Y - 0.1, 2.4), wallMat);
  wallLow.position.y = (BELT_Y - 0.1) / 2;
  g.add(wall, wallLow);
  g.position.set(x, 0, BELT_Z);
  return g;
}
scene.add(makeOpening(BELT_LEN / 2 - 0.1), makeOpening(-BELT_LEN / 2 + 0.1));

// ---------- Masa (bandın önünde, oyuncunun çalışma yüzeyi) ----------
const wood = new THREE.MeshStandardMaterial({ color: 0x5c4129, roughness: 0.8 });
const desk = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.06, 0.6), wood);
desk.position.set(0, 0.75, -0.05);
desk.receiveShadow = true;
desk.castShadow = true;
scene.add(desk);
for (const [x, z] of [[-0.95, -0.3], [0.95, -0.3], [-0.95, 0.2], [0.95, 0.2]]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.72, 0.05), wood);
  leg.position.set(x, 0.36, z);
  scene.add(leg);
}
const DESK_TOP = 0.78;

// Masa lambası (gövde)
const lampMetal = new THREE.MeshStandardMaterial({ color: 0x2c3a2e, metalness: 0.7, roughness: 0.4 });
const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.03, 20), lampMetal);
lampBase.position.set(-0.9, DESK_TOP + 0.015, -0.28);
const lampArm = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.55, 8), lampMetal);
lampArm.position.set(-0.88, DESK_TOP + 0.24, -0.28);
lampArm.rotation.z = 0.1;
const lampHead = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.14, 20, 1, true), new THREE.MeshStandardMaterial({ color: 0x2c3a2e, metalness: 0.7, roughness: 0.4, side: THREE.DoubleSide }));
lampHead.position.copy(lamp.position);
lampHead.lookAt(lamp.target.position);
lampHead.rotateX(Math.PI / 2);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffe2a8 }));
bulb.position.copy(lamp.position).add(new THREE.Vector3(0.02, -0.04, -0.02));
scene.add(lampBase, lampArm, lampHead, bulb);

// ---------- Paket türleri ----------
// Her paket: gövde + userData.lid (açılınca kalkan parça) + userData.inside (açılınca görünen karanlık iç)
function shadowAll(g) { g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return g; }
const insideMat = new THREE.MeshBasicMaterial({ color: 0x0c0906 });

function makeCrate() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.24, 0.32), new THREE.MeshStandardMaterial({ color: 0x9a7648, roughness: 0.9 }));
  body.position.y = 0.12;
  g.add(body);
  const slatMat = new THREE.MeshStandardMaterial({ color: 0x735534, roughness: 0.9 });
  for (const y of [0.04, 0.2]) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.43, 0.035, 0.325), slatMat);
    s.position.y = y;
    g.add(s);
  }
  const inside = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.28), insideMat);
  inside.rotation.x = -Math.PI / 2;
  inside.position.y = 0.242;
  g.add(inside);
  // Kapak + kırmızı mum mühür
  const lid = new THREE.Group();
  const lidBoard = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.025, 0.34), slatMat);
  const seal = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.012, 16), new THREE.MeshStandardMaterial({ color: 0x8e1b16, roughness: 0.4 }));
  seal.position.y = 0.017;
  lid.add(lidBoard, seal);
  lid.position.y = 0.253;
  g.add(lid);
  g.userData.lid = lid;
  g.userData.top = 0.24;
  return shadowAll(g);
}

function makeSack() {
  const g = new THREE.Group();
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    const r = 0.17 * Math.sin(Math.PI * Math.min(1, t * 1.1)) + 0.03;
    pts.push(new THREE.Vector2(Math.max(0.05, r), t * 0.34));
  }
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 20), new THREE.MeshStandardMaterial({ color: 0xa89468, roughness: 1, side: THREE.DoubleSide }));
  body.scale.set(1.1, 1, 0.85);
  const seam = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.24, 0.005), new THREE.MeshStandardMaterial({ color: 0x5a4a30 }));
  seam.position.set(0, 0.16, 0.155);
  const inside = new THREE.Mesh(new THREE.CircleGeometry(0.05, 16), insideMat);
  inside.rotation.x = -Math.PI / 2;
  inside.position.y = 0.335;
  g.add(body, seam, inside);
  // İp bağı (açılınca çözülüp kalkar)
  const lid = new THREE.Group();
  const knot = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.01, 8, 16), new THREE.MeshStandardMaterial({ color: 0x3d2b1a }));
  knot.rotation.x = Math.PI / 2;
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.08, 6), knot.material);
  tail.position.set(0.05, -0.03, 0);
  tail.rotation.z = 0.4;
  lid.add(knot, tail);
  lid.position.y = 0.33;
  g.add(lid);
  g.userData.lid = lid;
  g.userData.top = 0.32;
  return shadowAll(g);
}

function makeGift() {
  const g = new THREE.Group();
  const boxMat = new THREE.MeshStandardMaterial({ color: 0x6b2a2a, roughness: 0.7 });
  const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xc9a54a, roughness: 0.4, metalness: 0.3 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.18, 0.3), boxMat);
  body.position.y = 0.09;
  const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.305, 0.18, 0.04), ribbonMat);
  r1.position.y = 0.09;
  const inside = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.28), insideMat);
  inside.rotation.x = -Math.PI / 2;
  inside.position.y = 0.182;
  g.add(body, r1, inside);
  // Kapak: kurdele ve fiyonk kapakla birlikte kalkar
  const lid = new THREE.Group();
  const lidBox = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.045, 0.32), boxMat);
  const lr1 = new THREE.Mesh(new THREE.BoxGeometry(0.325, 0.047, 0.04), ribbonMat);
  const lr2 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.047, 0.325), ribbonMat);
  const bow = new THREE.Mesh(new THREE.TorusKnotGeometry(0.03, 0.01, 32, 6), ribbonMat);
  bow.position.y = 0.05;
  lid.add(lidBox, lr1, lr2, bow);
  lid.position.y = 0.19;
  g.add(lid);
  g.userData.lid = lid;
  g.userData.top = 0.18;
  return shadowAll(g);
}

// ---------- Paketten çıkan eşyalar ----------
// Her eşya alt-merkez orijinli; w = masada kapladığı genişlik
const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...extra });
const ITEMS = {
  bread: { name: 'Ekmek', w: 0.16, make() {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 12), std(0xb07a3c));
    m.scale.set(0.15, 0.07, 0.08); m.position.y = 0.035; return m; } },
  book: { name: 'Kitap', w: 0.11, make(i = 0) {
    const g = new THREE.Group();
    const cover = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.14), std([0x3b4a6b, 0x6b3b3b, 0x3b5a3b][i % 3]));
    const pages = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.024, 0.132), std(0xe0d8c0));
    cover.position.y = 0.015; pages.position.set(0.004, 0.015, 0);
    g.add(cover, pages); return g; } },
  sock: { name: 'Yün çorap', w: 0.08, make() {
    const g = new THREE.Group();
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.02, 0.12), std(0x6b6e5a, { roughness: 1 }));
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.02, 0.07), leg.material);
    leg.position.set(0, 0.01, -0.02); foot.position.set(0.02, 0.01, 0.06); foot.rotation.y = 0.8;
    g.add(leg, foot); return g; } },
  sweater: { name: 'Kazak', w: 0.2, make() {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.04, 0.15), std(0x5b3a3a, { roughness: 1 }));
    m.position.y = 0.02; return m; } },
  can: { name: 'Konserve', w: 0.08, make() {
    const g = new THREE.Group();
    const tin = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.09, 16), std(0xa0a6a6, { metalness: 0.8, roughness: 0.35 }));
    const label = new THREE.Mesh(new THREE.CylinderGeometry(0.0355, 0.0355, 0.05, 16, 1, true), std(0x8a2e24));
    tin.position.y = label.position.y = 0.045;
    g.add(tin, label); return g; } },
  soap: { name: 'Sabun', w: 0.08, make() {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.03, 0.05), std(0xd8d2b0, { roughness: 0.5 }));
    m.position.y = 0.015; return m; } },
  cake: { name: 'Pasta', w: 0.19, make() {
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.06, 24), std(0x7a4426));
    const icing = new THREE.Mesh(new THREE.CylinderGeometry(0.092, 0.092, 0.015, 24), std(0xefe6d6, { roughness: 0.5 }));
    base.position.y = 0.03; icing.position.y = 0.065;
    g.add(base, icing); return g; } },
  bear: { name: 'Oyuncak ayı', w: 0.1, make() {
    const g = new THREE.Group();
    const fur = std(0x7a5634, { roughness: 1 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.045, 14, 10), fur); body.position.y = 0.045;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.033, 14, 10), fur); head.position.y = 0.11;
    const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 6), fur); e1.position.set(-0.025, 0.14, 0);
    const e2 = e1.clone(); e2.position.x = 0.025;
    g.add(body, head, e1, e2); return g; } },
  letter: { name: 'Mektup', w: 0.13, make() {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.004, 0.08), std(0xe8e0c8, { roughness: 1 }));
    m.position.y = 0.002; m.rotation.y = 0.15; return m; } },
};

// Her paketin kendi manifestosu ve gerçek içeriği var
const SHIPMENTS = [
  { make: makeCrate, name: 'Mühürlü tahta kutu', no: '7741-B', to: 'Mahkûm #2291', from: 'E. Varga (Eş)',
    items: ['Ekmek ........ 1 adet', 'Kitap ........ 2 adet', 'Yün çorap .... 1 çift'], kg: '1.20',
    contents: ['bread', 'book', 'book', 'sock'] },
  { make: makeSack, name: 'Dikişli çuval', no: '7742-A', to: 'Mahkûm #0418', from: 'M. Dragan (Anne)',
    items: ['Kazak ........ 1 adet', 'Konserve ..... 3 adet', 'Sabun ........ 2 adet'], kg: '2.40',
    contents: ['sweater', 'can', 'can', 'can', 'soap', 'soap'] },
  { make: makeGift, name: 'Hediye paketi', no: '7743-C', to: 'Mahkûm #1107', from: 'L. Petrov (Kızı)',
    items: ['Pasta ........ 1 adet', 'Oyuncak ayı .. 1 adet', 'Mektup ....... 1 adet'], kg: '1.00',
    contents: ['cake', 'bear', 'letter'] },
];
let shipmentIndex = 0;

// ---------- Manifesto (masada, aktif paketin belgesi) ----------
const manifestCanvas = document.createElement('canvas');
manifestCanvas.width = 512; manifestCanvas.height = 700;
const manifestTex = new THREE.CanvasTexture(manifestCanvas);
manifestTex.colorSpace = THREE.SRGBColorSpace;

function drawManifest(s) {
  const x = manifestCanvas.getContext('2d');
  x.fillStyle = '#d9d0b4'; x.fillRect(0, 0, 512, 700);
  x.fillStyle = '#2a241a';
  if (!s) {
    x.font = 'italic 24px Courier New';
    x.fillText('— Paket bekleniyor —', 110, 350);
  } else {
    x.font = 'bold 34px Courier New'; x.fillText('GÖNDERİ MANİFESTOSU', 40, 70);
    x.font = '22px Courier New';
    x.fillText('No: ' + s.no, 40, 120);
    x.fillText('Alıcı: ' + s.to, 40, 155);
    x.fillText('Gönderen: ' + s.from, 40, 190);
    x.fillRect(40, 215, 432, 2);
    x.fillText('İÇERİK:', 40, 260);
    s.items.forEach((it, i) => x.fillText('- ' + it, 40, 300 + i * 35));
    x.fillRect(40, 410, 432, 2);
    x.fillText('Toplam ağırlık: ' + s.kg + ' kg', 40, 455);
  }
  x.font = 'italic 18px Courier New';
  x.fillText('Devlet Ceza İnfaz Kurumu — Form 12', 40, 660);
  manifestTex.needsUpdate = true;
}
drawManifest(null);

const manifest = new THREE.Mesh(
  new THREE.PlaneGeometry(0.21, 0.29),
  new THREE.MeshStandardMaterial({ map: manifestTex, roughness: 1, color: 0xa8a293 })
);
manifest.rotation.x = -Math.PI / 2;
manifest.rotation.z = 0.08;
manifest.position.set(-0.45, DESK_TOP + 0.001, 0.0);
manifest.receiveShadow = true;
scene.add(manifest);

// ---------- Damgalar ----------
function makeStamp(color, x) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.03, 0.06), new THREE.MeshStandardMaterial({ color, roughness: 0.6 }));
  base.position.y = 0.015;
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.02, 0.07, 12), new THREE.MeshStandardMaterial({ color: 0x1b1712, roughness: 0.7 }));
  handle.position.y = 0.065;
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.025, 12, 12), handle.material);
  knob.position.y = 0.11;
  g.add(base, handle, knob);
  shadowAll(g);
  // Görünmez, daha geniş tıklama alanı
  const hit = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.16, 0.12), new THREE.MeshBasicMaterial({ visible: false }));
  hit.position.y = 0.07;
  g.add(hit);
  g.position.set(x, DESK_TOP, -0.02);
  g.userData.baseY = DESK_TOP;
  return g;
}
const stampApprove = makeStamp(0x2f6a2c, 0.64);
const stampSeize = makeStamp(0x8a1d18, 0.8);
scene.add(stampApprove, stampSeize);


// ---------- Basit animasyon (tween) sistemi ----------
const tweens = [];
const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
// obj'yi (kendi ebeveyn uzayında) hedefe taşır; arc > 0 ise kavis çizerek gider
function tween(obj, to, { dur = 0.6, arc = 0, rotY, delay = 0, done } = {}) {
  tweens.push({ obj, from: null, to: to.clone(), dur, arc, rotY, delay, done, t: 0 });
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i];
    if (w.delay > 0) { w.delay -= dt; continue; }
    if (!w.from) { w.from = w.obj.position.clone(); w.fromRot = w.obj.rotation.y; }
    w.t += dt;
    const k = Math.min(1, w.t / w.dur), e = ease(k);
    w.obj.position.lerpVectors(w.from, w.to, e);
    w.obj.position.y += Math.sin(Math.PI * k) * w.arc;
    if (w.rotY !== undefined) w.obj.rotation.y = w.fromRot + (w.rotY - w.fromRot) * e;
    if (k >= 1) { tweens.splice(i, 1); w.done && w.done(); }
  }
}

// ---------- Paket akışı ----------
// incoming (bantta gelir) → belt (önümüzde bekler) → toDesk → desk (kapalı) → opening → open
// → karar → returning (eşyalar kutuya, kutu banda) → outgoing (sola gider)
const DESK_SPOT = new THREE.Vector3(0.12, DESK_TOP, -0.16);
const ITEM_ROW_Z = 0.16;
const ITEM_ROW_START = -0.3;

let current = null;
let outgoing = [];
let processed = 0;
const QUOTA = 5;
const quotaEl = document.getElementById('quota');

function spawnNext() {
  const s = SHIPMENTS[shipmentIndex % SHIPMENTS.length];
  shipmentIndex++;
  const mesh = s.make();
  mesh.position.set(SPAWN_X, BELT_Y, BELT_Z);
  mesh.rotation.y = (Math.random() - 0.5) * 0.3;
  scene.add(mesh);
  current = { s, mesh, state: 'incoming', items: [] };
}

function bringToDesk() {
  current.state = 'toDesk';
  tween(current.mesh, DESK_SPOT, { dur: 0.8, arc: 0.18, rotY: 0, done: () => { current.state = 'desk'; } });
}

function openPackage() {
  const c = current;
  c.state = 'opening';
  const lid = c.mesh.userData.lid;
  // Kapak kalkar, arkaya doğru uzaklaşır ve kaybolur
  tween(lid, lid.position.clone().add(new THREE.Vector3(-0.1, 0.35, -0.3)), {
    dur: 0.6, done: () => { lid.visible = false; } });
  // Eşyalar tek tek kutudan çıkıp masanın önüne dizilir
  const top = DESK_SPOT.clone(); top.y += c.mesh.userData.top;
  let x = ITEM_ROW_START;
  let bookCount = 0;
  c.s.contents.forEach((key, i) => {
    const def = ITEMS[key];
    const mesh = def.make(key === 'book' ? bookCount++ : 0);
    shadowAll(mesh);
    const obj = new THREE.Group();
    obj.add(mesh);
    obj.position.copy(top);
    obj.visible = false;
    scene.add(obj);
    const slot = new THREE.Vector3(x + def.w / 2, DESK_TOP, ITEM_ROW_Z);
    x += def.w + 0.02;
    c.items.push({ obj, name: def.name });
    tween(obj, slot, { dur: 0.55, arc: 0.12, delay: 0.35 + i * 0.18,
      done: () => { if (i === c.s.contents.length - 1) c.state = 'open'; } });
    // Tween başlarken görünür olsun
    setTimeout(() => { obj.visible = true; }, (0.35 + i * 0.18) * 1000);
  });
}

function decide(verdict) {
  const c = current;
  if (!c || (c.state !== 'desk' && c.state !== 'open')) return;
  c.verdict = verdict;
  c.state = 'returning';
  current = null;
  processed++;
  quotaEl.textContent = processed + ' / ' + QUOTA;
  drawManifest(null);

  const top = DESK_SPOT.clone(); top.y += c.mesh.userData.top;
  c.items.forEach((it, i) => tween(it.obj, top, { dur: 0.35, arc: 0.08, delay: i * 0.06,
    done: () => scene.remove(it.obj) }));
  const lid = c.mesh.userData.lid;
  const back = () => tween(c.mesh, new THREE.Vector3(INSPECT_X, BELT_Y, BELT_Z), { dur: 0.7, arc: 0.18,
    done: () => { c.state = 'outgoing'; outgoing.push(c); setTimeout(spawnNext, 900); } });
  // Açıldıysa kapak geri takılır, sonra kutu banda döner
  if (lid.visible && lid.position.y === lid.userData.homeY) back();
  else {
    lid.visible = true;
    tween(lid, new THREE.Vector3(0, lid.userData.homeY, 0), { dur: 0.35, delay: c.items.length * 0.06 + 0.3, done: back });
  }
}

// Damga basma animasyonu
const stampAnims = [];
function pressStamp(stamp) {
  stampAnims.push({ stamp, t: 0 });
}

spawnNext();

// ---------- Etkileşim ----------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const hint = document.getElementById('hint');
addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

const PACKAGE_HINT = {
  incoming: 'bantta geliyor',
  belt: 'masaya almak için tıkla',
  toDesk: '',
  desk: 'açmak için tıkla',
  opening: 'açılıyor…',
  open: 'açıldı · eşyaları manifestoyla karşılaştır',
};

function hoverTarget() {
  raycaster.setFromCamera(mouse, camera);
  const canStamp = current && (current.state === 'desk' || current.state === 'open');
  const list = [
    { obj: stampApprove, id: 'approve', text: canStamp ? 'ONAY damgası — tıkla' : 'ONAY damgası · önce paketi masaya al' },
    { obj: stampSeize, id: 'seize', text: canStamp ? 'EL KOY damgası — tıkla' : 'EL KOY damgası · önce paketi masaya al' },
    { obj: manifest, id: 'manifest', text: current && current.state !== 'incoming' ? 'Manifesto — ' + current.s.no : 'Manifesto — paket bekleniyor' },
  ];
  if (current) {
    list.push({ obj: current.mesh, id: 'package', text: current.s.name + ' — ' + PACKAGE_HINT[current.state] });
    for (const it of current.items) if (it.obj.visible) list.push({ obj: it.obj, id: 'item', text: it.name });
  }
  let best = null, bestD = Infinity;
  for (const h of list) {
    const hit = raycaster.intersectObject(h.obj, true)[0];
    if (hit && hit.distance < bestD) { best = h; bestD = hit.distance; }
  }
  return best;
}

addEventListener('click', () => {
  const h = hoverTarget();
  if (!h || !current) return;
  if (h.id === 'package') {
    if (current.state === 'belt') bringToDesk();
    else if (current.state === 'desk') openPackage();
  } else if (h.id === 'approve' || h.id === 'seize') {
    if (current.state !== 'desk' && current.state !== 'open') return;
    pressStamp(h.id === 'approve' ? stampApprove : stampSeize);
    setTimeout(() => decide(h.id), 250);
  }
});

// ---------- Jeneratör / ışık ----------
const DAY_LENGTH = 180; // saniye
let lightLeft = DAY_LENGTH;
const lightFill = document.getElementById('light-fill');
const LAMP_MAX = 6, CEIL_MAX = 14;
const bulbColor = new THREE.Color(0xffe2a8);

// ---------- Döngü ----------
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Fareyle hafif kafa hareketi
  camera.position.x = CAM_BASE.x + mouse.x * 0.04;
  camera.position.y = CAM_BASE.y + mouse.y * 0.02;
  camera.lookAt(lookTarget.x + mouse.x * 0.12, lookTarget.y + mouse.y * 0.06, lookTarget.z);

  // Bant hareketi: sadece bir şey taşınırken döner
  const beltMoving = (current && current.state === 'incoming') || outgoing.length > 0;
  if (beltMoving) beltTex.offset.x += (BELT_SPEED * dt) / 0.4;

  if (current && current.state === 'incoming') {
    current.mesh.position.x = Math.max(INSPECT_X, current.mesh.position.x - BELT_SPEED * dt);
    if (current.mesh.position.x === INSPECT_X) {
      current.state = 'belt';
      current.mesh.userData.lid.userData.homeY = current.mesh.userData.lid.position.y;
      drawManifest(current.s);
    }
  }
  outgoing = outgoing.filter(o => {
    o.mesh.position.x -= BELT_SPEED * dt;
    if (o.mesh.position.x < EXIT_X) { scene.remove(o.mesh); return false; }
    return true;
  });

  updateTweens(dt);

  // Damga animasyonu: kalk → bas → geri dön
  for (let i = stampAnims.length - 1; i >= 0; i--) {
    const a = stampAnims[i];
    a.t += dt;
    const p = a.t / 0.4;
    a.stamp.position.y = a.stamp.userData.baseY + Math.sin(Math.min(1, p) * Math.PI) * 0.06;
    if (p >= 1) { a.stamp.position.y = a.stamp.userData.baseY; stampAnims.splice(i, 1); }
  }

  // Jeneratör: ışık azalır; azaldıkça titreme artar
  lightLeft = Math.max(0, lightLeft - dt);
  const ratio = lightLeft / DAY_LENGTH;
  lightFill.style.width = (ratio * 100) + '%';
  const flickerChance = 0.005 + (1 - ratio) * 0.12;
  let k = 0.45 + 0.55 * ratio;
  if (Math.random() < flickerChance) k *= Math.random() * 0.5;
  k *= 0.98 + Math.sin(t * 50) * 0.02;
  if (ratio === 0) k = 0;
  lamp.intensity = LAMP_MAX * k;
  ceiling.intensity = CEIL_MAX * k;
  ambient.intensity = 0.15 + 0.75 * k;
  tube.material.color.setScalar(0.15 + 0.85 * k);
  bulb.material.color.copy(bulbColor).multiplyScalar(0.3 + 0.7 * k);

  // Hover
  const h = hoverTarget();
  hint.textContent = h ? h.text : 'Paket banttan gelir · Tıkla: masaya al → tıkla: aç → damgala';
  const clickable = h && (h.id === 'approve' || h.id === 'seize' ||
    (h.id === 'package' && (current.state === 'belt' || current.state === 'desk')));
  document.body.style.cursor = clickable ? 'pointer' : 'default';

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
