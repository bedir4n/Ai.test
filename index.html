<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denetçi — Prototip</title>
<style>
  :root {
    --ink: #d8cfb8;
    --dim: #8a806a;
    --red: #b3372c;
    --bg: #050505;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: "Courier New", monospace; color: var(--ink); }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; background: rgba(10,9,7,.78); border: 1px solid #3a342a; padding: 10px 14px; font-size: 13px; line-height: 1.5; }
  #top-left { top: 12px; left: 12px; }
  #top-right { top: 12px; right: 12px; text-align: right; }
  #rule { color: var(--red); font-weight: bold; }
  .label { color: var(--dim); }
  #light-bar { width: 160px; height: 6px; background: #1c1a15; margin-top: 4px; }
  #light-fill { height: 100%; width: 100%; background: #d9b35a; transition: width .2s linear; }
  #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--dim); text-align: center; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.85) 100%); }
</style>
</head>
<body>
<div id="hud">
  <div id="vignette"></div>
  <div class="panel" id="top-left">
    <div><span class="label">GÜN</span> <b id="day">1</b></div>
    <div><span class="label">GÜNÜN KURALI:</span> <span id="rule">İsyan riski — METAL YASAK</span></div>
  </div>
  <div class="panel" id="top-right">
    <div><span class="label">KOTA</span> <b id="quota">0 / 5</b></div>
    <div><span class="label">RÖNTGEN</span> <b id="xray">3</b></div>
    <div><span class="label">JENERATÖR</span></div>
    <div id="light-bar"><div id="light-fill"></div></div>
  </div>
  <div id="hint">Fare ile etrafa bak · Paketin üzerine gel</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- Renderer / Sahne ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040404);
scene.fog = new THREE.Fog(0x040404, 3, 9);

// Oyuncu masada oturuyor, masaya yukarıdan bakıyor
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 50);
const CAM_BASE = new THREE.Vector3(0, 1.55, 1.1);
camera.position.copy(CAM_BASE);
const lookTarget = new THREE.Vector3(0, 0.8, -0.2);

// ---------- Işıklar ----------
scene.add(new THREE.AmbientLight(0x1a1f2a, 0.35));
// Oyuncunun arkasından gelen çok zayıf soğuk dolgu ışığı
const fill = new THREE.PointLight(0x6f7f99, 0.6, 4, 1.5);
fill.position.set(0, 1.8, 1.2);
scene.add(fill);

const lamp = new THREE.SpotLight(0xffd79a, 9, 5, Math.PI / 4.2, 0.5, 1.6);
lamp.position.set(-0.55, 1.3, -0.35);
lamp.target.position.set(0, 0.78, -0.1);
lamp.castShadow = true;
lamp.shadow.mapSize.set(1024, 1024);
lamp.shadow.bias = -0.0005;
scene.add(lamp, lamp.target);

// ---------- Oda ----------
const concrete = new THREE.MeshStandardMaterial({ color: 0x2b2b28, roughness: 0.95 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), concrete);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), new THREE.MeshStandardMaterial({ color: 0x23261f, roughness: 1 }));
backWall.position.set(0, 2.5, -1.6);
backWall.receiveShadow = true;
scene.add(backWall);

// Duvarda paketlerin geldiği kapak (servis penceresi)
const hatch = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.05), new THREE.MeshStandardMaterial({ color: 0x15130f, metalness: 0.6, roughness: 0.5 }));
hatch.position.set(0.9, 1.15, -1.57);
scene.add(hatch);

// ---------- Masa ----------
const wood = new THREE.MeshStandardMaterial({ color: 0x4a3423, roughness: 0.8 });
const desk = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.06, 1.2), wood);
desk.position.set(0, 0.75, -0.3);
desk.receiveShadow = true;
desk.castShadow = true;
scene.add(desk);
for (const [x, z] of [[-1, -0.8], [1, -0.8], [-1, 0.2], [1, 0.2]]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.72, 0.06), wood);
  leg.position.set(x, 0.36, z);
  leg.castShadow = true;
  scene.add(leg);
}
const DESK_TOP = 0.78;

// Masa lambası (gövde)
const lampMetal = new THREE.MeshStandardMaterial({ color: 0x2c3a2e, metalness: 0.7, roughness: 0.4 });
const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.03, 20), lampMetal);
lampBase.position.set(-0.75, DESK_TOP + 0.015, -0.55);
const lampArm = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.52, 8), lampMetal);
lampArm.position.set(-0.66, DESK_TOP + 0.25, -0.45);
lampArm.rotation.z = -0.25;
const lampHead = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.16, 20, 1, true), new THREE.MeshStandardMaterial({ color: 0x2c3a2e, metalness: 0.7, roughness: 0.4, side: THREE.DoubleSide }));
lampHead.position.copy(lamp.position);
lampHead.lookAt(lamp.target.position);
lampHead.rotateX(Math.PI / 2);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffe2a8 }));
bulb.position.copy(lamp.position).add(new THREE.Vector3(0.02, -0.04, 0.02));
scene.add(lampBase, lampArm, lampHead, bulb);

// ---------- Paket (mühürlü tahta kutu) ----------
function makeCrate() {
  const g = new THREE.Group();
  const plank = new THREE.MeshStandardMaterial({ color: 0x8a6a42, roughness: 0.9 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.26, 0.32), plank);
  body.castShadow = body.receiveShadow = true;
  g.add(body);
  // Tahta çıtalar
  const slatMat = new THREE.MeshStandardMaterial({ color: 0x6d5132, roughness: 0.9 });
  for (const y of [-0.09, 0.09]) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.43, 0.035, 0.325), slatMat);
    s.position.y = y;
    g.add(s);
  }
  // Kırmızı mum mühür
  const seal = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.012, 16), new THREE.MeshStandardMaterial({ color: 0x8e1b16, roughness: 0.4 }));
  seal.rotation.x = Math.PI / 2;
  seal.position.set(0, 0.02, 0.166);
  g.add(seal);
  g.position.set(0.05, DESK_TOP + 0.13, -0.35);
  g.rotation.y = -0.12;
  return g;
}
const crate = makeCrate();
scene.add(crate);

// ---------- Manifesto (gönderi belgesi) ----------
function makeManifestTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 700;
  const x = c.getContext('2d');
  x.fillStyle = '#d9d0b4'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#2a241a';
  x.font = 'bold 34px Courier New'; x.fillText('GÖNDERİ MANİFESTOSU', 40, 70);
  x.font = '22px Courier New';
  x.fillText('No: 7741-B', 40, 120);
  x.fillText('Alıcı: Mahkûm #2291', 40, 155);
  x.fillText('Gönderen: E. Varga (Eş)', 40, 190);
  x.fillRect(40, 215, 432, 2);
  x.fillText('İÇERİK:', 40, 260);
  x.fillText('- Ekmek ........ 1 adet', 40, 300);
  x.fillText('- Kitap ........ 2 adet', 40, 335);
  x.fillText('- Yün çorap .... 1 çift', 40, 370);
  x.fillRect(40, 400, 432, 2);
  x.fillText('Toplam ağırlık: 1.20 kg', 40, 445);
  x.font = 'italic 18px Courier New';
  x.fillText('Devlet Ceza İnfaz Kurumu — Form 12', 40, 660);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const manifest = new THREE.Mesh(
  new THREE.PlaneGeometry(0.21, 0.29),
  new THREE.MeshStandardMaterial({ map: makeManifestTexture(), roughness: 1, color: 0x9a9384 })
);
manifest.rotation.x = -Math.PI / 2;
manifest.rotation.z = 0.08;
manifest.position.set(-0.4, DESK_TOP + 0.001, -0.05);
manifest.receiveShadow = true;
scene.add(manifest);

// ---------- Damgalar ----------
function makeStamp(color, x) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.03, 0.06), new THREE.MeshStandardMaterial({ color, roughness: 0.6 }));
  base.position.y = 0.015;
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.02, 0.07, 12), new THREE.MeshStandardMaterial({ color: 0x1b1712, roughness: 0.7 }));
  handle.position.y = 0.065;
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.025, 12, 12), handle.material);
  knob.position.y = 0.11;
  g.add(base, handle, knob);
  g.traverse(o => o.castShadow = true);
  g.position.set(x, DESK_TOP, 0.1);
  return g;
}
const stampApprove = makeStamp(0x2f5a2c, 0.55);
const stampSeize = makeStamp(0x7a1d18, 0.72);
scene.add(stampApprove, stampSeize);

// ---------- Etkileşim (hover) ----------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const hint = document.getElementById('hint');
const hoverables = [
  { obj: crate, text: 'Mühürlü tahta kutu — (sonraki adım: aç / incele)' },
  { obj: manifest, text: 'Gönderi manifestosu — Ekmek, 2 Kitap, Yün çorap · 1.20 kg' },
  { obj: stampApprove, text: 'ONAY damgası' },
  { obj: stampSeize, text: 'EL KOY damgası' },
];
addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

// ---------- Jeneratör / ışık ----------
const DAY_LENGTH = 180; // saniye
let lightLeft = DAY_LENGTH;
const lightFill = document.getElementById('light-fill');

// ---------- Döngü ----------
const clock = new THREE.Clock();
function tick() {
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // Fareyle hafif kafa hareketi
  camera.position.x = CAM_BASE.x + mouse.x * 0.12;
  camera.position.y = CAM_BASE.y + mouse.y * 0.05;
  camera.lookAt(lookTarget.x + mouse.x * 0.5, lookTarget.y + mouse.y * 0.3, lookTarget.z);

  // Işık azalır; azaldıkça titreme artar
  lightLeft = Math.max(0, lightLeft - dt);
  const ratio = lightLeft / DAY_LENGTH;
  lightFill.style.width = (ratio * 100) + '%';
  const flickerChance = 0.01 + (1 - ratio) * 0.15;
  let intensity = 9 * (0.35 + 0.65 * ratio);
  if (Math.random() < flickerChance) intensity *= Math.random() * 0.5;
  intensity *= 0.97 + Math.sin(t * 50) * 0.03;
  lamp.intensity = ratio > 0 ? intensity : 0;
  bulb.material.color.setScalar(0.3 + 0.7 * (lamp.intensity / 9)).multiply(new THREE.Color(0xffe2a8));

  // Hover
  raycaster.setFromCamera(mouse, camera);
  let found = null;
  for (const h of hoverables) {
    if (raycaster.intersectObject(h.obj, true).length) { found = h; break; }
  }
  hint.textContent = found ? found.text : 'Fare ile etrafa bak · Nesnelerin üzerine gel';
  document.body.style.cursor = found ? 'pointer' : 'default';

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
