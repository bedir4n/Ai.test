<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masa Başı Denetçi</title>
<style>
  :root {
    --ink: #d8cfb8;
    --dim: #8a806a;
    --red: #c2402f;
    --green: #6fa35a;
    --uv: #a77bff;
    --bg: #0b0b0a;
    --panel: rgba(10,9,7,.8);
    --line: #3a342a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: "Courier New", monospace; color: var(--ink); }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; font-size: 13px; line-height: 1.5; }
  #top-left { top: 12px; left: 12px; max-width: min(360px, calc(100vw - 24px)); }
  #top-right { top: 12px; right: 12px; text-align: right; }
  #rule { color: var(--red); font-weight: bold; }
  .label { color: var(--dim); letter-spacing: .05em; }
  #light-bar { width: 160px; height: 6px; background: #1c1a15; margin-top: 4px; margin-left: auto; }
  #light-fill { height: 100%; width: 100%; background: #d9b35a; transition: width .2s linear; }
  #hint { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--ink); text-align: center; background: var(--panel); padding: 4px 10px; border: 1px solid var(--line); white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #hint:empty { display: none; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); transition: background .3s; }
  body.uv #vignette { background: radial-gradient(ellipse at center, rgba(40,10,80,.15) 40%, rgba(5,0,15,.8) 100%); }

  #tools { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; }
  #tools button { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; }
  #tools button kbd { color: var(--dim); font-family: inherit; margin-right: 4px; }
  #tools button.active { border-color: var(--ink); background: #2a251c; }
  #tools button[data-tool="uv"].active { border-color: var(--uv); color: var(--uv); }
  #tools button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  #toast { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: bold; padding: 8px 16px; background: var(--panel); border: 1px solid var(--line); opacity: 0; transition: opacity .3s; text-align: center; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; }
  #toast.good { color: var(--green); border-color: var(--green); }
  #toast.bad { color: var(--red); border-color: var(--red); }
  #toast.aha { color: #e8c35a; border-color: #e8c35a; }

  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.82); pointer-events: auto; padding: 16px; }
  #overlay .card { max-width: 460px; width: 100%; border: 1px solid var(--line); background: #13110d; padding: 24px; line-height: 1.6; }
  #overlay h2 { margin: 0 0 12px; font-size: 20px; letter-spacing: .08em; text-wrap: balance; }
  #overlay ul { padding-left: 18px; margin: 12px 0; font-size: 13px; }
  #overlay button { font: inherit; margin-top: 12px; padding: 10px 16px; background: #2a251c; color: var(--ink); border: 1px solid var(--ink); cursor: pointer; }
  #manifest-panel { top: 96px; left: 12px; width: 290px; max-width: calc(100vw - 24px); background: rgba(217,208,180,.94); color: #2a241a; border-color: #8a806a; }
  #manifest-panel .label { color: #6b604a; }
  #manifest-panel .m-title { font-weight: bold; letter-spacing: .08em; margin-bottom: 4px; }
  #manifest-panel table { width: 100%; border-collapse: collapse; margin: 6px 0; border-top: 1px solid #8a806a; border-bottom: 1px solid #8a806a; font-variant-numeric: tabular-nums; }
  #manifest-panel td { padding: 2px 0; }
  #manifest-panel td:nth-child(2), #manifest-panel td:nth-child(3) { text-align: right; padding-left: 8px; }
  .ok { color: var(--green); } .no { color: var(--red); }
</style>
</head>
<body>
<div id="hud">
  <div id="vignette"></div>
  <div class="panel" id="top-left">
    <div><span class="label">GÜN</span> <b id="day">1</b></div>
    <div><span class="label">GÜNÜN KURALI:</span> <span id="rule">Silah, mühimmat, kesici alet ve gizli mesaj YASAK</span></div>
  </div>
  <div class="panel" id="top-right">
    <div><span class="label">DOĞRU KARAR</span> <b id="quota">0 / 5</b></div>
    <div><span class="label">İHLAL</span> <b id="violations">0</b></div>
    <div><span class="label">JENERATÖR</span></div>
    <div id="light-bar"><div id="light-fill"></div></div>
  </div>
  <div class="panel" id="manifest-panel" hidden></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="tools">
    <button data-tool="hand"><kbd>Esc</kbd>El</button>
    <button data-tool="knife"><kbd>1</kbd>Neşter</button>
    <button data-tool="uv"><kbd>2</kbd>UV Fener</button>
  </div>
</div>
<div id="overlay" hidden></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';


// ---------- Renderer / Sahne ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0a);
scene.fog = new THREE.Fog(0x0b0b0a, 5, 14);

// Oyuncu masada oturuyor, bandı ve masayı yukarıdan görüyor
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 50);
const CAM_BASE = new THREE.Vector3(0, 1.8, 1.25);
camera.position.copy(CAM_BASE);
const lookTarget = new THREE.Vector3(0, 0.78, -0.45);

// ---------- Işıklar ----------
const ambient = new THREE.HemisphereLight(0xb8c2c8, 0x3a3226, 0.9);
scene.add(ambient);

// Tavandaki floresan (soğuk genel ışık)
const ceiling = new THREE.PointLight(0xdfe8e4, 14, 8, 1.4);
ceiling.position.set(0, 2.6, -0.4);
ceiling.castShadow = true;
ceiling.shadow.mapSize.set(1024, 1024);
ceiling.shadow.bias = -0.001;
scene.add(ceiling);
const tube = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.04, 0.08), new THREE.MeshBasicMaterial({ color: 0xe8f2ee }));
tube.position.set(0, 2.7, -0.4);
scene.add(tube);

// Masa lambası (sıcak odak ışığı)
const lamp = new THREE.SpotLight(0xffd79a, 6, 5, Math.PI / 3.6, 0.6, 1.6);
lamp.position.set(-0.85, 1.25, -0.28);
lamp.target.position.set(-0.1, 0.8, -0.2);
lamp.castShadow = true;
lamp.shadow.mapSize.set(1024, 1024);
lamp.shadow.bias = -0.0005;
scene.add(lamp, lamp.target);

// ---------- Oda ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: 0x4a4944, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x4d5448, roughness: 1 });
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
backWall.position.set(0, 2.5, -1.4);
backWall.receiveShadow = true;
scene.add(backWall);
// Duvarın alt yarısı koyu boyalı (kurum duvarı)
const wainscot = new THREE.Mesh(new THREE.PlaneGeometry(12, 1.2), new THREE.MeshStandardMaterial({ color: 0x2f3a33, roughness: 0.9 }));
wainscot.position.set(0, 0.6, -1.39);
scene.add(wainscot);

// ---------- Konveyör bant ----------
const BELT_Z = -0.62;
const BELT_Y = 0.9;           // bant üst yüzeyi
const BELT_LEN = 5.2;
const BELT_W = 0.55;
const BELT_SPEED = 0.55;      // m/sn
const SPAWN_X = 2.4;          // sağdaki açıklıktan girer
const EXIT_X = -2.4;          // soldaki açıklıktan çıkar
const INSPECT_X = 0;          // tam önümüzde durur

const frameMat = new THREE.MeshStandardMaterial({ color: 0x3b4238, metalness: 0.6, roughness: 0.5 });
const frameL = new THREE.Mesh(new THREE.BoxGeometry(BELT_LEN, 0.08, 0.04), frameMat);
frameL.position.set(0, BELT_Y - 0.02, BELT_Z + BELT_W / 2 + 0.02);
const frameR = frameL.clone();
frameR.position.z = BELT_Z - BELT_W / 2 - 0.02;
const beltBody = new THREE.Mesh(new THREE.BoxGeometry(BELT_LEN, 0.1, BELT_W), frameMat);
beltBody.position.set(0, BELT_Y - 0.06, BELT_Z);
beltBody.receiveShadow = true;
scene.add(frameL, frameR, beltBody);
for (let x = -2.2; x <= 2.2; x += 1.1) {
  for (const dz of [BELT_W / 2 - 0.03, -BELT_W / 2 + 0.03]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05, BELT_Y - 0.1, 0.05), frameMat);
    leg.position.set(x, (BELT_Y - 0.1) / 2, BELT_Z + dz);
    scene.add(leg);
  }
}

// Kayan lastik yüzey (dokusu kaydırılarak hareket hissi verilir)
function makeBeltTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#1d1d1b'; x.fillRect(0, 0, 256, 64);
  x.fillStyle = '#2c2c29';
  for (let i = 0; i < 256; i += 32) x.fillRect(i, 0, 6, 64);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(BELT_LEN / 0.4, 1);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const beltTex = makeBeltTexture();
const beltTop = new THREE.Mesh(new THREE.PlaneGeometry(BELT_LEN, BELT_W - 0.02), new THREE.MeshStandardMaterial({ map: beltTex, roughness: 0.85 }));
beltTop.rotation.x = -Math.PI / 2;
beltTop.position.set(0, BELT_Y - 0.009, BELT_Z);
beltTop.receiveShadow = true;
scene.add(beltTop);

// Bandın iki ucundaki duvar açıklıkları (lastik perdeli)
function makeOpening(x) {
  const g = new THREE.Group();
  const w = 0.75, h = 0.6;
  const dark = new THREE.Mesh(new THREE.BoxGeometry(0.3, h, w), new THREE.MeshBasicMaterial({ color: 0x050505 }));
  dark.position.y = BELT_Y + h / 2 - 0.05;
  const topBar = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.08, w + 0.1), frameMat);
  topBar.position.y = BELT_Y + h;
  g.add(dark, topBar);
  const flapMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.6, transparent: true, opacity: 0.85 });
  for (let i = 0; i < 6; i++) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.01, h - 0.12, w / 6 - 0.01), flapMat);
    f.position.set(x > 0 ? -0.16 : 0.16, BELT_Y + h / 2, -w / 2 + w / 12 + i * w / 6);
    g.add(f);
  }
  // Açıklığın etrafındaki duvar parçası
  const wall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.6, 2.4), wallMat);
  wall.position.set(0, 1.3 + (BELT_Y + h) / 2 + 0.05, 0);
  wall.scale.y = (2.6 - (BELT_Y + h)) / 2.6;
  wall.position.y = BELT_Y + h + (2.6 - (BELT_Y + h)) / 2 + 0.04;
  const wallLow = new THREE.Mesh(new THREE.BoxGeometry(0.2, BELT_Y - 0.1, 2.4), wallMat);
  wallLow.position.y = (BELT_Y - 0.1) / 2;
  g.add(wall, wallLow);
  g.position.set(x, 0, BELT_Z);
  return g;
}
scene.add(makeOpening(BELT_LEN / 2 - 0.1), makeOpening(-BELT_LEN / 2 + 0.1));

// ---------- Masa (bandın önünde, oyuncunun çalışma yüzeyi) ----------
const wood = new THREE.MeshStandardMaterial({ color: 0x5c4129, roughness: 0.8 });
const desk = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.06, 0.6), wood);
desk.position.set(0, 0.75, -0.05);
desk.receiveShadow = true;
desk.castShadow = true;
scene.add(desk);
for (const [x, z] of [[-0.95, -0.3], [0.95, -0.3], [-0.95, 0.2], [0.95, 0.2]]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.72, 0.05), wood);
  leg.position.set(x, 0.36, z);
  scene.add(leg);
}
const DESK_TOP = 0.78;

// Masa lambası (gövde)
const lampMetal = new THREE.MeshStandardMaterial({ color: 0x2c3a2e, metalness: 0.7, roughness: 0.4 });
const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.03, 20), lampMetal);
lampBase.position.set(-0.9, DESK_TOP + 0.015, -0.28);
const lampArm = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.55, 8), lampMetal);
lampArm.position.set(-0.88, DESK_TOP + 0.24, -0.28);
lampArm.rotation.z = 0.1;
const lampHead = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.14, 20, 1, true), new THREE.MeshStandardMaterial({ color: 0x2c3a2e, metalness: 0.7, roughness: 0.4, side: THREE.DoubleSide }));
lampHead.position.copy(lamp.position);
lampHead.lookAt(lamp.target.position);
lampHead.rotateX(Math.PI / 2);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffe2a8 }));
bulb.position.copy(lamp.position).add(new THREE.Vector3(0.02, -0.04, -0.02));
scene.add(lampBase, lampArm, lampHead, bulb);


// ---------- Paket türleri ----------
// Her paket: gövde + userData.lid (açılınca kalkan parça) + userData.inside (açılınca görünen karanlık iç)
function shadowAll(g) { g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return g; }
const insideMat = new THREE.MeshBasicMaterial({ color: 0x0c0906 });

function makeCrate() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.24, 0.32), new THREE.MeshStandardMaterial({ color: 0x9a7648, roughness: 0.9 }));
  body.position.y = 0.12;
  g.add(body);
  const slatMat = new THREE.MeshStandardMaterial({ color: 0x735534, roughness: 0.9 });
  for (const y of [0.04, 0.2]) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.43, 0.035, 0.325), slatMat);
    s.position.y = y;
    g.add(s);
  }
  const inside = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.28), insideMat);
  inside.rotation.x = -Math.PI / 2;
  inside.position.y = 0.242;
  g.add(inside);
  // Kapak + kırmızı mum mühür
  const lid = new THREE.Group();
  const lidBoard = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.025, 0.34), slatMat);
  const seal = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.012, 16), new THREE.MeshStandardMaterial({ color: 0x8e1b16, roughness: 0.4 }));
  seal.position.y = 0.017;
  lid.add(lidBoard, seal);
  lid.position.y = 0.253;
  g.add(lid);
  g.userData.lid = lid;
  g.userData.top = 0.24;
  return shadowAll(g);
}

function makeSack() {
  const g = new THREE.Group();
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    const r = 0.17 * Math.sin(Math.PI * Math.min(1, t * 1.1)) + 0.03;
    pts.push(new THREE.Vector2(Math.max(0.05, r), t * 0.34));
  }
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 20), new THREE.MeshStandardMaterial({ color: 0xa89468, roughness: 1, side: THREE.DoubleSide }));
  body.scale.set(1.1, 1, 0.85);
  const seam = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.24, 0.005), new THREE.MeshStandardMaterial({ color: 0x5a4a30 }));
  seam.position.set(0, 0.16, 0.155);
  const inside = new THREE.Mesh(new THREE.CircleGeometry(0.05, 16), insideMat);
  inside.rotation.x = -Math.PI / 2;
  inside.position.y = 0.335;
  g.add(body, seam, inside);
  // İp bağı (açılınca çözülüp kalkar)
  const lid = new THREE.Group();
  const knot = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.01, 8, 16), new THREE.MeshStandardMaterial({ color: 0x3d2b1a }));
  knot.rotation.x = Math.PI / 2;
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.08, 6), knot.material);
  tail.position.set(0.05, -0.03, 0);
  tail.rotation.z = 0.4;
  lid.add(knot, tail);
  lid.position.y = 0.33;
  g.add(lid);
  g.userData.lid = lid;
  g.userData.top = 0.32;
  return shadowAll(g);
}

function makeGift() {
  const g = new THREE.Group();
  const boxMat = new THREE.MeshStandardMaterial({ color: 0x6b2a2a, roughness: 0.7 });
  const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xc9a54a, roughness: 0.4, metalness: 0.3 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.18, 0.3), boxMat);
  body.position.y = 0.09;
  const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.305, 0.18, 0.04), ribbonMat);
  r1.position.y = 0.09;
  const inside = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.28), insideMat);
  inside.rotation.x = -Math.PI / 2;
  inside.position.y = 0.182;
  g.add(body, r1, inside);
  // Kapak: kurdele ve fiyonk kapakla birlikte kalkar
  const lid = new THREE.Group();
  const lidBox = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.045, 0.32), boxMat);
  const lr1 = new THREE.Mesh(new THREE.BoxGeometry(0.325, 0.047, 0.04), ribbonMat);
  const lr2 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.047, 0.325), ribbonMat);
  const bow = new THREE.Mesh(new THREE.TorusKnotGeometry(0.03, 0.01, 32, 6), ribbonMat);
  bow.position.y = 0.05;
  lid.add(lidBox, lr1, lr2, bow);
  lid.position.y = 0.19;
  g.add(lid);
  g.userData.lid = lid;
  g.userData.top = 0.18;
  return shadowAll(g);
}


// ---------- Ses (WebAudio ile sentezlenir, dosya gerekmez) ----------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, { type = 'sine', gain = 0.15, slide = 0 } = {}) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), a.currentTime + dur);
  g.gain.setValueAtTime(gain, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, { freq = 2000, q = 1, gain = 0.2 } = {}) {
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.value = gain;
  src.connect(f).connect(g).connect(a.destination);
  src.start();
}
const SFX = {
  cut: () => { noise(0.22, { freq: 3800, q: 2, gain: 0.3 }); setTimeout(() => noise(0.18, { freq: 1600, q: 3, gain: 0.2 }), 110); },
  lid: () => { noise(0.3, { freq: 420, q: 0.8, gain: 0.35 }); tone(150, 0.15, { type: 'triangle', gain: 0.1, slide: -60 }); },
  pop: () => tone(700, 0.08, { type: 'square', gain: 0.05, slide: 500 }),
  beep: () => tone(1800, 0.08, { type: 'square', gain: 0.04 }),
  lever: () => { noise(0.12, { freq: 300, gain: 0.4 }); tone(90, 0.22, { gain: 0.25, slide: -40 }); },
  clang: () => { noise(0.4, { freq: 900, q: 4, gain: 0.3 }); tone(220, 0.4, { type: 'triangle', gain: 0.08, slide: -80 }); },
  buzz: () => tone(110, 0.55, { type: 'sawtooth', gain: 0.1 }),
  good: () => { tone(660, 0.1, { gain: 0.08 }); setTimeout(() => tone(880, 0.16, { gain: 0.08 }), 100); },
  aha: () => { tone(520, 0.12, { type: 'triangle', gain: 0.12 }); setTimeout(() => tone(780, 0.28, { type: 'triangle', gain: 0.12 }), 110); },
  uv: () => tone(55, 0.35, { type: 'sawtooth', gain: 0.05 }),
};

// ---------- Basit animasyon (tween) sistemi ----------
const tweens = [];
const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
// obj'yi (kendi ebeveyn uzayında) hedefe taşır; arc > 0 ise kavis çizerek gider
function tween(obj, to, { dur = 0.6, arc = 0, rotY, delay = 0, done } = {}) {
  tweens.push({ obj, from: null, to: to.clone(), dur, arc, rotY, delay, done, t: 0 });
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i];
    if (w.delay > 0) { w.delay -= dt; continue; }
    if (!w.from) { w.from = w.obj.position.clone(); w.fromRot = w.obj.rotation.y; w.obj.visible = true; }
    w.t += dt;
    const k = Math.min(1, w.t / w.dur), e = ease(k);
    w.obj.position.lerpVectors(w.from, w.to, e);
    w.obj.position.y += Math.sin(Math.PI * k) * w.arc;
    if (w.rotY !== undefined) w.obj.rotation.y = w.fromRot + (w.rotY - w.fromRot) * e;
    if (k >= 1) { tweens.splice(i, 1); w.done && w.done(); }
  }
}

  if (shipmentIndex >= SHIPMENTS.length) { endDay('done'); return; }
  const s = SHIPMENTS[shipmentIndex++];
  const mesh = s.make();
  mesh.position.set(SPAWN_X, BELT_Y, BELT_Z);
  mesh.rotation.y = (Math.random() - 0.5) * 0.3;
  scene.add(mesh);
  current = { s, mesh, state: 'incoming', items: [] };
}

function bringToDesk() {
  current.state = 'toDesk';
  SFX.pop();
  tween(current.mesh, DESK_SPOT, { dur: 0.8, arc: 0.18, rotY: 0, done: () => { current.state = 'desk'; } });
}

function openPackage() {
  const c = current;
  c.state = 'opening';
  SFX.lid();
  const lid = c.mesh.userData.lid;
  tween(lid, lid.position.clone().add(new THREE.Vector3(-0.1, 0.35, -0.3)), { dur: 0.6, done: () => { lid.visible = false; } });
  const top = DESK_SPOT.clone(); top.y += c.mesh.userData.top;
  let x = ITEM_ROW_START;
  c.s.contents.forEach((data, i) => {
    const def = ITEMS[data.key];
    const model = def.make(data);
    let uvMark = null;
    if (data.uv) {
      uvMark = makeUvMark(data.uv, def.uv.w, def.uv.h);
      uvMark.position.set(...def.uv.pos);
      uvMark.rotation.x = def.uv.rotX;
      model.add(uvMark);
    }
    shadowAll(model);
    const obj = new THREE.Group();
    obj.add(model);
    obj.position.copy(top);
    obj.visible = false;
    scene.add(obj);
    const slot = new THREE.Vector3(x + def.w / 2, DESK_TOP, ITEM_ROW_Z);
    x += def.w + 0.03;
    const it = { obj, model, def, data, slot, name: def.name, uvMark, onScale: false, cut: false, extracted: false };
    c.items.push(it);
    tween(obj, slot, { dur: 0.55, arc: 0.12, delay: 0.35 + i * 0.2,
      done: () => { SFX.pop(); if (i === c.s.contents.length - 1) c.state = 'open'; } });
  });
}

const weightOf = it => it.extracted ? it.data.declared + 2 : it.data.real;

function toggleScale(it) {
  if (it.busy) return;
  if (it.onScale) {
    it.busy = true; it.onScale = false; scaleItem = null; scaleTarget = 0;
    tween(it.obj, it.slot, { dur: 0.45, arc: 0.08, done: () => { it.busy = false; } });
    return;
  }
  if (scaleItem) toggleScale(scaleItem);
  it.busy = true;
  scaleItem = it;
  tween(it.obj, new THREE.Vector3(SCALE_POS.x, SCALE_TOP, SCALE_POS.z), { dur: 0.45, arc: 0.08,
    done: () => { it.busy = false; it.onScale = true; scaleTarget = weightOf(it); SFX.beep(); } });
}

function cutItem(it) {
  if (it.cut || it.busy) return;
  if (!it.def.cut) { toast('Bu eşya neşterle kesilemez.'); return; }
  it.cut = true;
  SFX.cut();
  const hidden = it.data.hidden;
  const res = it.def.cut(it.model, !!hidden);
  shadowAll(it.model);
  for (const { h, s } of res.halves) tween(h, new THREE.Vector3(s * res.spread, 0, 0), { dur: 0.35 });
  // UV yazısı kumaşla birlikte bir yarıda kalır
  if (it.uvMark && res.halves.length) { it.model.remove(it.uvMark); res.halves[0].h.add(it.uvMark); }
  if (hidden) {
    const cb = CONTRABAND[hidden];
    const cbObj = new THREE.Group();
    cbObj.add(shadowAll(cb.make()));
    // Küçük nesne: tıklaması kolay olsun diye görünmez geniş alan
    const hit = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.09, 0.07), new THREE.MeshBasicMaterial({ visible: false }));
    cbObj.add(hit);
    cbObj.position.copy(it.obj.position).add(new THREE.Vector3(0, res.hiddenY, 0));
    cbObj.visible = false;
    scene.add(cbObj);
    tween(cbObj, cbObj.position.clone().add(new THREE.Vector3(0, 0.04, 0)), { dur: 0.4, delay: 0.35,
      done: () => { SFX.aha(); toast('Bir şey var! ' + cb.name, 'aha'); } });
    current.items.push({ obj: cbObj, name: cb.name, contraband: true, parent: it, inTray: false });
  } else {
    setTimeout(() => toast('İçi temiz görünüyor.'), 400);
  }
}

function moveToTray(cb) {
  if (cb.inTray) return;
  cb.inTray = true;
  cb.parent.extracted = true;
  if (cb.parent.onScale) scaleTarget = weightOf(cb.parent);
  const target = TRAY_POS.clone().add(new THREE.Vector3(-0.045 + (trayCount++ % 3) * 0.045, 0.008, 0));
  SFX.pop();
  tween(cb.obj, target, { dur: 0.5, arc: 0.1 });
}

function pullLever(lever) {
  SFX.lever();
  leverAnims.push({ pivot: lever.userData.pivot, t: 0 });
}

function decide(verdict) {
  const c = current;
  if (!c || (c.state !== 'desk' && c.state !== 'open')) return;
  c.state = 'returning';
  current = null;
  processed++;
  const illegal = !!c.s.illegal;
  const correct = (verdict === 'seize') === illegal;
  if (correct) {
    correctCount++;
    toast(verdict === 'seize' ? 'DOĞRU — ' + c.s.illegal : 'DOĞRU — paket temizdi.', 'good');
    SFX.good();
  } else {
    violations++;
    toast(verdict === 'seize' ? 'İHLAL — paket temizdi. Masum birinin payına el koydun.' : 'İHLAL — ' + c.s.illegal, 'bad');
    SFX.buzz();
  }
  results.push({ s: c.s, verdict, correct });
  quotaEl.textContent = correctCount + ' / ' + QUOTA;
  violationsEl.textContent = violations;
  drawManifest(null);
  scaleItem = null; scaleTarget = 0;
  trayCount = 0;

  // Her şey (kaçaklar dahil) kutuya geri döner
  const top = DESK_SPOT.clone(); top.y += c.mesh.userData.top;
  c.items.forEach((it, i) => tween(it.obj, top, { dur: 0.35, arc: 0.08, delay: i * 0.06, done: () => scene.remove(it.obj) }));

  const next = () => setTimeout(spawnNext, 900);
  const dispatch = verdict === 'approve'
    ? () => tween(c.mesh, new THREE.Vector3(INSPECT_X, BELT_Y, BELT_Z), { dur: 0.7, arc: 0.18,
        done: () => { c.state = 'outgoing'; outgoing.push(c); next(); } })
    : () => tween(c.mesh, new THREE.Vector3(BIN_POS.x, 0.85, BIN_POS.z), { dur: 0.8, arc: 0.25,
        done: () => tween(c.mesh, new THREE.Vector3(BIN_POS.x, 0.1, BIN_POS.z), { dur: 0.35,
          done: () => { SFX.clang(); scene.remove(c.mesh); next(); } }) });

  const lid = c.mesh.userData.lid;
  if (lid.visible && lid.position.y === lid.userData.homeY) dispatch();
  else {
    lid.visible = true;
    tween(lid, new THREE.Vector3(0, lid.userData.homeY, 0), { dur: 0.35, delay: c.items.length * 0.06 + 0.3, done: dispatch });
  }
}

// ---------- Gün sonu ----------
function endDay(reason) {
  if (dayOver) return;
  dayOver = true;
  const passed = correctCount >= QUOTA;
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `<div class="card">
    <h2>${reason === 'dark' ? 'JENERATÖR SUSTU' : 'GÜN 1 SONA ERDİ'}</h2>
    <div>Doğru karar: <b>${correctCount}</b> / ${SHIPMENTS.length} · İhlal: <b>${violations}</b> · Kota: ${QUOTA}</div>
    <ul>${results.map(r => `<li class="${r.correct ? 'ok' : 'no'}">${r.s.no} ${r.s.name} — ${r.verdict === 'seize' ? 'EL KOY' : 'ONAY'} ${r.correct ? '✓' : '✗'}${r.s.illegal ? ' · ' + r.s.illegal : ' · temizdi'}</li>`).join('')}</ul>
    <div class="${passed ? 'ok' : 'no'}">${passed
      ? 'Kota doldu. Gardiyan seni hücrene götürüyor. Yarın yine bu masadasın.'
      : 'Kota dolmadı. Yarın sabah adın infaz listesinde.'}</div>
    <button id="restart">Günü baştan oyna</button></div>`;
  overlay.hidden = false;
  document.getElementById('restart').addEventListener('click', () => location.reload());
}

spawnNext();

// ---------- Etkileşim ----------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const hint = document.getElementById('hint');
renderer.domElement.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

const PACKAGE_HINT = {
  incoming: 'bantta geliyor',
  belt: 'tıkla: masaya al',
  toDesk: '',
  desk: 'tıkla: aç',
  opening: 'açılıyor…',
  open: 'boş · eşyaları incele',
};
const canDecide = () => current && (current.state === 'desk' || current.state === 'open');

function itemHint(it) {
  if (it.contraband) return it.inTray ? `KAÇAK: ${it.name} (delil tepsisinde)` : `KAÇAK: ${it.name} — tıkla: delil tepsisine koy`;
  if (tool === 'knife') return it.cut ? `${it.name} — kesildi` : it.def.cut ? `${it.name} — tıkla: neşterle kes` : `${it.name} — kesilemez`;
  if (tool === 'uv') return it.uvMark && it.uvMark.material.opacity > 0.4 ? `UV: "${it.data.uv.join(' ')}"` : `${it.name} — UV ışığında iz yok`;
  return it.onScale ? `${it.name} — terazide: ${weightOf(it)} g · tıkla: geri al` : `${it.name} — tıkla: teraziye koy`;
}

function hoverTarget() {
  raycaster.setFromCamera(mouse, camera);
  const list = [
    { obj: leverApprove, id: 'approve', text: canDecide() ? 'ONAY kolu — paket temiz, banda gönder' : 'ONAY kolu · önce paketi masaya al' },
    { obj: leverSeize, id: 'seize', text: canDecide() ? 'EL KOY kolu — pakete el koy, çukura at' : 'EL KOY kolu · önce paketi masaya al' },
    { obj: scaleGroup, id: 'scale', text: scaleItem ? `Terazi — ${Math.round(scaleReading)} g` : 'Terazi — boş · eşyaya tıklayıp üstüne koy' },
    { obj: tray, id: 'tray', text: 'Delil tepsisi' },
    { obj: manifest, id: 'manifest', text: canDecide() ? 'Manifesto — okunaklı kopyası solda' : 'Manifesto — paket bekleniyor' },
  ];
  if (current) {
    list.push({ obj: current.mesh, id: 'package', text: current.s.name + ' — ' + PACKAGE_HINT[current.state] });
    for (const it of current.items) if (it.obj.visible) list.push({ obj: it.obj, id: it.contraband ? 'contraband' : 'item', it });
  }
  // Bulunan kaçak nesne, içinden çıktığı eşyanın önüne geçer
  let best = null, bestD = Infinity;
  for (const h of list) {
    const hit = raycaster.intersectObject(h.obj, true)[0];
    if (!hit) continue;
    const d = h.id === 'contraband' ? hit.distance - 1 : hit.distance;
    if (d < bestD) { best = h; bestD = d; }
  }
  if (best && best.it) best.text = itemHint(best.it);
  return best;
}

renderer.domElement.addEventListener('click', () => {
  audio();
  if (dayOver) return;
  const h = hoverTarget();
  if (!h) return;
  if (h.id === 'package' && current) {
    if (current.state === 'belt') bringToDesk();
    else if (current.state === 'desk') openPackage();
  } else if (h.id === 'item') {
    if (tool === 'hand') toggleScale(h.it);
    else if (tool === 'knife') cutItem(h.it);
  } else if (h.id === 'contraband') {
    moveToTray(h.it);
  } else if (h.id === 'approve' || h.id === 'seize') {
    if (!canDecide()) return;
    pullLever(h.id === 'approve' ? leverApprove : leverSeize);
    setTimeout(() => decide(h.id), 300);
  }
});

// ---------- Jeneratör / ışık ----------
const DAY_LENGTH = 300; // saniye
let lightLeft = DAY_LENGTH;
let darkScheduled = false;
const lightFill = document.getElementById('light-fill');
const LAMP_MAX = 6, CEIL_MAX = 14;
const bulbColor = new THREE.Color(0xffe2a8);

// ---------- Döngü ----------
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Fareyle hafif kafa hareketi
  camera.position.x = CAM_BASE.x + mouse.x * 0.04;
  camera.position.y = CAM_BASE.y + mouse.y * 0.02;
  camera.lookAt(lookTarget.x + mouse.x * 0.12, lookTarget.y + mouse.y * 0.06, lookTarget.z);

  // Bant hareketi: sadece bir şey taşınırken döner
  const beltMoving = (current && current.state === 'incoming') || outgoing.length > 0;
  if (beltMoving) beltTex.offset.x += (BELT_SPEED * dt) / 0.4;

  if (current && current.state === 'incoming') {
    current.mesh.position.x = Math.max(INSPECT_X, current.mesh.position.x - BELT_SPEED * dt);
    if (current.mesh.position.x === INSPECT_X) {
      current.state = 'belt';
      current.mesh.userData.lid.userData.homeY = current.mesh.userData.lid.position.y;
      drawManifest(current.s);
    }
  }
  outgoing = outgoing.filter(o => {
    o.mesh.position.x -= BELT_SPEED * dt;
    if (o.mesh.position.x < EXIT_X) { scene.remove(o.mesh); return false; }
    return true;
  });

  updateTweens(dt);

  // Kol animasyonu: kendine doğru çek → geri bırak
  for (let i = leverAnims.length - 1; i >= 0; i--) {
    const a = leverAnims[i];
    a.t += dt;
    const p = Math.min(1, a.t / 0.6);
    a.pivot.rotation.x = -0.35 + Math.sin(p * Math.PI) * 0.85;
    if (p >= 1) { a.pivot.rotation.x = -0.35; leverAnims.splice(i, 1); }
  }

  // Terazi göstergesi hedefe doğru titreyerek oturur
  if (Math.abs(scaleReading - scaleTarget) > 0.5) {
    scaleReading += (scaleTarget - scaleReading) * Math.min(1, dt * 8);
    drawScale(scaleReading + (Math.random() - 0.5) * 3);
  } else if (scaleReading !== scaleTarget) {
    scaleReading = scaleTarget;
    drawScale(scaleReading);
  }

  // İmlecin masadaki noktası (UV fener buraya tutulur)
  raycaster.setFromCamera(mouse, camera);
  raycaster.ray.intersectPlane(deskPlane, cursorPoint);

  // Jeneratör: ışık azalır; azaldıkça titreme artar
  lightLeft = Math.max(0, lightLeft - dt);
  const ratio = lightLeft / DAY_LENGTH;
  lightFill.style.width = (ratio * 100) + '%';
  const flickerChance = 0.005 + (1 - ratio) * 0.12;
  let k = 0.45 + 0.55 * ratio;
  if (Math.random() < flickerChance) k *= Math.random() * 0.5;
  k *= 0.98 + Math.sin(t * 50) * 0.02;
  if (ratio === 0) k = 0;
  const uvOn = tool === 'uv' && ratio > 0;
  const room = uvOn ? k * 0.25 : k;
  lamp.intensity = LAMP_MAX * room;
  ceiling.intensity = CEIL_MAX * room;
  ambient.intensity = 0.1 + 0.8 * room;
  tube.material.color.setScalar(0.15 + 0.85 * room);
  bulb.material.color.copy(bulbColor).multiplyScalar(0.3 + 0.7 * room);
  if (ratio === 0 && !dayOver && !darkScheduled) { darkScheduled = true; setTimeout(() => endDay('dark'), 1500); }

  uvLight.intensity = uvOn ? 9 : 0;
  uvLight.position.set(cursorPoint.x, DESK_TOP + 0.55, cursorPoint.z + 0.3);
  uvLight.target.position.copy(cursorPoint);

  // UV mürekkebi yalnızca fener yakınken parlar
  if (current) for (const it of current.items) {
    if (!it.uvMark) continue;
    it.uvMark.getWorldPosition(tmp);
    const d = Math.hypot(tmp.x - cursorPoint.x, tmp.z - cursorPoint.z);
    it.uvMark.material.opacity = uvOn ? Math.min(1, Math.max(0, (0.16 - d) / 0.08)) : 0;
    if (it.uvMark.material.opacity > 0.6 && !it.uvFound) {
      it.uvFound = true;
      SFX.aha();
      toast('UV ışığında gizli yazı: "' + it.data.uv.join(' ') + '"', 'aha');
    }
  }

  // Hover
  const h = dayOver ? null : hoverTarget();
  hint.textContent = h ? h.text : (current && current.state === 'open'
    ? 'El: teraziye koy · 1 Neşter: kes · 2 UV: gizli yazı ara · Sonra kolu çek'
    : 'Paket banttan gelir · Tıkla: masaya al → tıkla: aç');
  const clickable = h && (
    ((h.id === 'approve' || h.id === 'seize') && canDecide()) ||
    (h.id === 'package' && (current.state === 'belt' || current.state === 'desk')) ||
    (h.id === 'item' && tool !== 'uv') || (h.id === 'contraband' && !h.it.inTray));
  renderer.domElement.style.cursor = tool === 'knife' ? 'crosshair' : clickable ? 'pointer' : 'default';

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
